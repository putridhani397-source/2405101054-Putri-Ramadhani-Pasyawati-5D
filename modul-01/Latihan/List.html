<!DOCTYPE html>
<html>
<head>
    <title>penggunaan tag list ol, ul dan li </title>
</head>
<body> 
    <h1>daftar hardware</h1>
    <ol type="I" start="1">
        <li>PSU</li>
        <li>RAM</li>
        <li>CD-ROM</li>
        <li>Processor</li>
        <li>VGA</li>
    </ol>
</body>

<body>
    <h1>daftar hardware</h1>
    <ul>
        <li>PSU</li>
        <li>RAM</li>
        <li>CD-ROM</li>
        <li>Processor</li>
        <li>VGA</li>
    </ul>
</body>
</html>
